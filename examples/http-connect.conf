[Profile]
Version = 1
Name = HTTP CONNECT example

[AccessKey]
Type = http
Server = proxy.example.com
Port = 8080
# Basic credentials are sent without encryption. Use only a trusted network.
# Username = alice
# Password = replace-me

[Interface]
Mode = vpn
MTU = 1420
DNS = 1.1.1.1

# DNS uses TCP through the proxy. Other proxied UDP is dropped.
[Routing]
Default = proxy
