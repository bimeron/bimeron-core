[Profile]
Version = 1
Name = Proxy

[AccessKey]
File = ../profiles/test.key

[Interface]
Mode = proxy
Listen = 127.0.0.1:1080
# Optional: require SOCKS5 username/password authentication (set both).
# ListenUsername = alice
# ListenPassword = "use a long random value"

[Routing]
Default = proxy

[Rule]
Domain = example.com
Action = direct
