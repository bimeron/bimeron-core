[Profile]
Version = 1
Name = HTTPS CONNECT example

[AccessKey]
HTTP = https://proxy.example.com:443
# Optional Basic authentication: percent-encode reserved credential characters.
# HTTP = https://alice:replace-me@proxy.example.com:443
# Alternatively, replace HTTP with Type = https, Server, Port, and optional
# paired Username and Password fields.
# The proxy certificate must match proxy.example.com and use a trusted CA.

[Interface]
Mode = proxy
Listen = 127.0.0.1:1080

# The local listener is SOCKS5. VPN mode forwards DNS over TCP and drops other
# proxied UDP. Direct routing rules still use the physical network.
[Routing]
Default = proxy
