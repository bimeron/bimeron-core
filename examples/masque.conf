[Profile]
Version = 1
Name = MASQUE HTTP/3 example

[AccessKey]
Type = masque
Server = proxy.example.com
Port = 443
# Optional when the certificate name differs from Server.
# ServerName = proxy.example.com
# Basic authentication is carried inside verified TLS.
# Username = alice
# Password = replace-me
# A private CA supplements the system trust store; relative to this config file.
# CAFile = proxy-ca.pem
# The default path is shown below. Both target variables are required.
# MASQUEPath = /.well-known/masque/udp/{target_host}/{target_port}/

[Interface]
Mode = proxy
Listen = 127.0.0.1:1080
# For a system VPN, set Mode = vpn and configure DNS for your deployment.
DNS = 1.1.1.1
MTU = 1420

[Routing]
Default = proxy
