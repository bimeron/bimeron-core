[Profile]
Version = 1
Name = macOS

[AccessKey]
File = ../profiles/test.key
# Alternatively use exactly one source: File, SS or SSConf.

[Interface]
Mode = vpn
Name = Bimeron
MTU = 1420
DNS = 1.1.1.1, 8.8.8.8
IPv6 = disable
KillSwitch = false

[Routing]
Default = proxy

