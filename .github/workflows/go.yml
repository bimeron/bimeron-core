name: Go tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Reject incompatible VLESS modules
        run: |
          if go list -m all | grep -E 'github.com/(sagernet/|juju/ratelimit|xtls/reality|xtls/xray-core)'; then
            echo 'A GPL/LGPL-dependent VLESS module entered the build graph' >&2
            exit 1
          fi
      - name: Verify compiled dependency notices
        run: |
          go list -deps -f '{{if .Module}}{{.Module.Path}}{{end}}' ./... | sort -u | while read -r module; do
            if [ -n "$module" ] && [ "$module" != bimeron ] && ! grep -Fq "$module " THIRD_PARTY_NOTICES.txt; then
              echo "Missing third-party notice for $module" >&2
              exit 1
            fi
          done
      - run: go test ./...
      - run: go vet ./...
      - name: Check shared, VLESS, VMess, and Trojan transport races
        run: CGO_ENABLED=1 go test -race ./internal/streamtransport ./internal/vless ./internal/vmess ./internal/trojan
      - name: Check AnyTLS transport races
        run: CGO_ENABLED=1 go test -race ./internal/anytls ./internal/accesskey ./internal/config
      - name: AnyTLS interoperability with reference server
        run: |
          git clone https://github.com/anytls/anytls-go.git "$RUNNER_TEMP/anytls-go"
          git -C "$RUNNER_TEMP/anytls-go" checkout fd6167acd6d73b9fa3e607659951847fbc9e6c50
          python3 - "$RUNNER_TEMP/anytls-go/cmd/server/main.go" <<'PY'
          from pathlib import Path
          import sys
          path = Path(sys.argv[1])
          source = path.read_text()
          old = 'GenerateKeyPair(time.Now, "")'
          assert old in source
          path.write_text(source.replace(old, 'GenerateKeyPair(time.Now, "localhost")'))
          PY
          go -C "$RUNNER_TEMP/anytls-go" build -o "$RUNNER_TEMP/anytls-server" ./cmd/server
          CGO_ENABLED=1 BIMERON_ANYTLS_BIN="$RUNNER_TEMP/anytls-server" go test -race ./internal/anytls -run '^TestReferenceServer$' -count=1 -v
          BIMERON_ANYTLS_BIN="$RUNNER_TEMP/anytls-server" go test ./internal/anytls -run '^$' -bench '^BenchmarkReferenceServer$' -benchtime=20x -count=1
      - name: Check NaiveProxy transport races
        run: CGO_ENABLED=1 go test -race ./internal/naive ./internal/accesskey ./internal/config
      - name: NaiveProxy interoperability with reference server
        run: |
          cd "$RUNNER_TEMP"
          go run github.com/caddyserver/xcaddy/cmd/xcaddy@v0.4.5 build v2.11.7 --output "$RUNNER_TEMP/naive-caddy" --with github.com/caddyserver/forwardproxy=github.com/klzgrad/forwardproxy@c096d6a00cb28e019cc1995b04bdc6a9311d8024
          cd "$GITHUB_WORKSPACE"
          BIMERON_NAIVE_CADDY_BIN="$RUNNER_TEMP/naive-caddy" go test ./internal/naive -run '^TestReferenceServer$' -count=1 -v
      - name: Check core and control races
        run: CGO_ENABLED=1 go test -race ./core ./internal/control ./internal/linuxnet ./internal/vpn ./internal/proxy ./internal/routing
      - name: VLESS and VMess transport interoperability with Xray
        run: |
          xray_dir="$(go mod download -json github.com/xtls/xray-core@v1.260327.0 | jq -r .Dir)"
          go -C "$xray_dir" build -o "$RUNNER_TEMP/xray" ./main
          CGO_ENABLED=1 BIMERON_XRAY_BIN="$RUNNER_TEMP/xray" go test -race ./internal/vmess -run '^TestXray(VMessAEAD|VLESSGRPC)$' -count=1 -v
      - name: Trojan TCP, WebSocket, and gRPC interoperability with Xray
        run: CGO_ENABLED=1 BIMERON_XRAY_BIN="$RUNNER_TEMP/xray" go test -race ./internal/trojan -run '^TestXrayTrojanInterop$' -count=1 -v
      - name: Shadowsocks 2022 interoperability with Xray
        run: CGO_ENABLED=1 BIMERON_XRAY_BIN="$RUNNER_TEMP/xray" go test -race ./internal/ss2022 -run '^TestXrayInterop$' -count=1 -v
      - name: Install Linux integration tools
        run: sudo apt-get update && sudo apt-get install -y iproute2 nftables
      - name: Isolated Linux network integration
        run: |
          go test -c -o "$RUNNER_TEMP/bimeron-core.test" ./core
          go test -c -o "$RUNNER_TEMP/bimeron-linuxnet.test" ./internal/linuxnet
          sudo unshare -n env BIMERON_NETNS_TEST=1 "$RUNNER_TEMP/bimeron-core.test" -test.run='TestLinuxTUN(HTTP|CleanupAndImmediateReopen)$' -test.v
          sudo unshare -n env BIMERON_NETNS_TEST=1 BIMERON_NFT_BIN="$(command -v nft)" "$RUNNER_TEMP/bimeron-linuxnet.test" -test.run='^TestNativeNetworkConfigureRecover$' -test.v
      - name: Isolated Linux daemon integration
        run: |
          go build -o "$RUNNER_TEMP/bimeron" ./cmd/bimeron
          go test -c -o "$RUNNER_TEMP/bimeron-control.test" ./internal/control
          sudo unshare -nm sh -c 'mount -t tmpfs tmpfs /run && BIMERON_CLI_TEST="$1" "$2" -test.run="^TestLinuxDaemonBinary$" -test.v' sh "$RUNNER_TEMP/bimeron" "$RUNNER_TEMP/bimeron-control.test"

  test-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - run: go test ./...
      - run: go vet ./...
      - name: Check core and control races
        run: go test -race ./core ./internal/control ./internal/proxy ./internal/routing

  test-apple-unsigned:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Build system extension and check C ABI
        run: sh scripts/build-apple.sh
      - name: Build app extension and check C ABI
        run: APPLE_EXTENSION_KIND=app-extension sh scripts/build-apple.sh

  test-fingerprint-dependencies:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: |
            go.sum
            third_party/apernet-quic-go/go.sum
            third_party/hysteria-core/go.sum
            internal/hysteria2/testdata/reference-server/go.sum
      - name: QUIC unit and wire tests
        working-directory: third_party/apernet-quic-go
        run: go test . ./internal/handshake ./internal/wire ./internal/ackhandler
      - name: QUIC interoperability and retry tests
        working-directory: third_party/apernet-quic-go
        run: go test ./integrationtests/self -run 'Test(FirefoxParrot|ChromeParrot)' -count=1
      - name: Hysteria client and server tests
        working-directory: third_party/hysteria-core
        run: go test ./client ./server
      - name: Race check the URI and relay adapters
        if: runner.os == 'Linux'
        run: go test -race ./internal/accesskey ./internal/hysteria2
      - name: Race check QUIC fingerprint state
        if: runner.os == 'Linux'
        working-directory: third_party/apernet-quic-go
        # Race instrumentation randomly drops sync.Pool entries; allocation counts
        # are checked by the ordinary unit test step above.
        run: go test -race -skip '^TestFrameParserAllocs$/^STREAM$' . ./internal/handshake ./internal/wire ./internal/ackhandler

  cli-dist:
    runs-on: ubuntu-latest
    env:
      BIMERON_VERSION: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - run: go run scripts/build-dist.go
      - run: go run scripts/check-dist.go
      - uses: actions/upload-artifact@v4
        with:
          name: cli-dist
          path: dist/
          retention-days: 14
          if-no-files-found: error
  android-dist:
    runs-on: ubuntu-latest
    env:
      BIMERON_VERSION: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Install Android NDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'ndk;27.2.12479018'
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"
      - name: Install gomobile
        run: |
          go install golang.org/x/mobile/cmd/gomobile@v0.0.0-20261011034528-197770444867
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - run: gomobile init
      - run: sh scripts/build-android.sh
      - name: Check Android package
        run: |
          test -s dist/android/bimeron-core.aar
          test -s dist/android/bimeron-core-sources.jar
          cmp LICENSE dist/android/LICENSE
          cmp THIRD_PARTY_NOTICES.txt dist/android/THIRD_PARTY_NOTICES.txt
          unzip -Z1 dist/android/bimeron-core.aar | grep 'libgojni.so$' | sort > /tmp/bimeron-abis.txt
          printf '%s\n' 'jni/arm64-v8a/libgojni.so' 'jni/armeabi-v7a/libgojni.so' 'jni/x86/libgojni.so' 'jni/x86_64/libgojni.so' > /tmp/bimeron-expected-abis.txt
          diff -u /tmp/bimeron-expected-abis.txt /tmp/bimeron-abis.txt
      - uses: actions/upload-artifact@v4
        with:
          name: android-dist
          path: dist/android/
          retention-days: 14
          if-no-files-found: error
