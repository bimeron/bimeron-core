name: Go tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - run: go test ./...
      - name: Linux TUN lifecycle
        run: |
          go test -c -o /tmp/bimeron-core.test ./core
          sudo unshare -n env BIMERON_NETNS_TEST=1 /tmp/bimeron-core.test -test.run='TestLinuxTUN(HTTP|CleanupAndImmediateReopen)$' -test.v

  test-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - run: go test ./...

  cli-dist:
    runs-on: ubuntu-latest
    env:
      BIMERON_VERSION: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - run: go run scripts/build-dist.go
      - run: go run scripts/check-dist.go
      - uses: actions/upload-artifact@v4
        with:
          name: cli-dist
          path: dist/
          retention-days: 14
          if-no-files-found: error

  android-dist:
    runs-on: ubuntu-latest
    env:
      BIMERON_VERSION: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Install Android NDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'ndk;27.2.12479018'
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"
      - name: Install gomobile
        run: |
          go install golang.org/x/mobile/cmd/gomobile@v0.0.0-20261011034528-197770444867
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - run: gomobile init
      - run: sh scripts/build-android.sh
      - name: Check Android package
        run: |
          test -s dist/android/bimeron-core.aar
          test -s dist/android/bimeron-core-sources.jar
          cmp LICENSE dist/android/LICENSE
          cmp THIRD_PARTY_NOTICES.txt dist/android/THIRD_PARTY_NOTICES.txt
          unzip -Z1 dist/android/bimeron-core.aar | grep 'libgojni.so$' | sort > /tmp/bimeron-abis.txt
          printf '%s\n' 'jni/arm64-v8a/libgojni.so' 'jni/armeabi-v7a/libgojni.so' 'jni/x86/libgojni.so' 'jni/x86_64/libgojni.so' > /tmp/bimeron-expected-abis.txt
          diff -u /tmp/bimeron-expected-abis.txt /tmp/bimeron-abis.txt
      - uses: actions/upload-artifact@v4
        with:
          name: android-dist
          path: dist/android/
          retention-days: 14
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [test, test-windows, cli-dist, android-dist]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/download-artifact@v4
        with:
          name: cli-dist
          path: dist
      - uses: actions/download-artifact@v4
        with:
          name: android-dist
          path: dist/android
      - name: Package release
        shell: bash
        run: |
          set -euo pipefail
          mkdir release
          cd dist
          for target in windows-amd64 windows-arm64 linux-amd64 linux-arm64 macos-amd64 macos-arm64 android; do
            zip -q -r -X "../release/bimeron-${GITHUB_REF_NAME}-${target}.zip" "$target"
          done
          cd ../release
          sha256sum *.zip > SHA256SUMS
          sha256sum --check SHA256SUMS
      - name: Create and verify signed update manifest
        env:
          BIMERON_RELEASE_ED25519_KEY: ${{ secrets.BIMERON_RELEASE_ED25519_KEY }}
          BIMERON_RELEASE_ED25519_PUBLIC_KEY: ${{ vars.BIMERON_RELEASE_ED25519_PUBLIC_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          go run scripts/release-manifest.go -tag "$GITHUB_REF_NAME" -dir release -require-reviewed
          go run scripts/release-manifest.go -tag "$GITHUB_REF_NAME" -dir release -verify -require-reviewed
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          cat > release-notes.md <<EOF
          Bimeron Core ${GITHUB_REF_NAME}.

          The assets contain six CLI packages for Windows, Linux, and macOS (amd64 and arm64) and one Android AAR package for armeabi-v7a, arm64-v8a, x86, and x86_64. Each package includes LICENSE and THIRD_PARTY_NOTICES.txt. The Windows packages also include the matching Wintun 0.14.1 DLL and WINTUN-LICENSE.txt.

          Verify downloaded archives with SHA256SUMS. Windows/Linux service update clients can also verify update-manifest.json with update-manifest.json.sig and a separately trusted Ed25519 public key. Android is an AAR, not an installable app. Apple NetworkExtension is not included in this release.
          EOF
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then
            gh release create "$GITHUB_REF_NAME" release/* --title "Bimeron Core $GITHUB_REF_NAME" --notes-file release-notes.md --prerelease --verify-tag
          else
            gh release create "$GITHUB_REF_NAME" release/* --title "Bimeron Core $GITHUB_REF_NAME" --notes-file release-notes.md --verify-tag
          fi
